name: Publish

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

concurrency:
  group: "publish"
  cancel-in-progress: true

jobs:
  # Wait for build workflow to complete
  wait-for-build:
    name: Wait for build to complete
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Linux x86_64 build
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Build x86_64-unknown-linux-gnu'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
      
      - name: Wait for Linux aarch64 build
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Build aarch64-unknown-linux-gnu'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
      
      - name: Wait for Windows x86_64 build
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Build x86_64-pc-windows-msvc'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
      
      - name: Wait for macOS build
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Build macOS universal binary'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  linux:
    needs: wait-for-build
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            deps: apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake libmpg123-dev libvorbis-dev
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install linker dependencies
        if: ${{ matrix.deps != '' }}
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update -y --fix-missing || true
          sudo ${{ matrix.deps }}
          sudo apt-get install -y --fix-missing libmpg123-dev:arm64 libvorbis-dev:arm64 || sudo apt-get install -y libmpg123-dev libvorbis-dev
      
      - name: Build and Publish
        run: ./gradlew publish -Ptarget=${{ matrix.target }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: wait-for-build
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc

    name: Publish ${{ matrix.target }}
    runs-on: windows-2022
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install mpg123 via vcpkg
        run: |
          vcpkg install mpg123:x64-windows libvorbis:x64-windows --triplet x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" >> $ENV:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" >> $ENV:GITHUB_ENV
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Build and Publish
        run: ./gradlew publish -Ptarget=${{ matrix.target }}
        env:
          GITHUB_ACTOR: ${{ env.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-x86_64:
    needs: wait-for-build
    name: Build macOS x86_64
    runs-on: macos-15-intel
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          brew upgrade cmake || brew install cmake
          brew install mpg123 libogg libvorbis
          cmake --version

      - name: Compile natives
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target=x86_64-apple-darwin

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-lib-publish
          path: target/x86_64-apple-darwin/release/libconnector.dylib

  macos-aarch64:
    needs: wait-for-build
    name: Build macOS aarch64
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          brew upgrade cmake || brew install cmake
          brew install mpg123 libogg libvorbis
          cmake --version

      - name: Compile natives
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --release --target=aarch64-apple-darwin

      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-lib-publish
          path: target/aarch64-apple-darwin/release/libconnector.dylib

  macos:
    needs: [macos-x86_64, macos-aarch64]
    name: Publish macOS universal binary
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-lib-publish
          path: artifacts/x86_64

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-aarch64-lib-publish
          path: artifacts/aarch64

      - name: Create target directory for darwin
        run: mkdir -p target/darwin/release

      - name: Combine to universal dylib
        run: lipo -create -output target/darwin/release/libconnector.dylib artifacts/x86_64/libconnector.dylib artifacts/aarch64/libconnector.dylib

      - name: Build and Publish
        run: ./gradlew publish -Ptarget=darwin -x cargoBuild
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
