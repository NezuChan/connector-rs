name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            lib-name: libconnector.so
            natives-path: linux-x86-64
          - os: macos-latest
            rust-target: x86_64-apple-darwin
            lib-name: libconnector.dylib
            natives-path: darwin-x86-64
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            lib-name: connector.dll
            natives-path: win-x86-64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.rust-target }}

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    - name: Build with Cargo
      run: cargo build --release --target ${{ matrix.rust-target }}

    - name: Run tests
      run: cargo test --target ${{ matrix.rust-target }}

    - name: Copy native library to resources
      shell: bash
      run: |
        mkdir -p src/main/resources/natives/${{ matrix.natives-path }}
        cp target/${{ matrix.rust-target }}/release/${{ matrix.lib-name }} src/main/resources/natives/${{ matrix.natives-path }}/

    - name: Upload native artifacts
      uses: actions/upload-artifact@v4
      with:
        name: natives-${{ matrix.os }}
        path: src/main/resources/natives/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download all native artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: natives-*
        path: downloaded-natives
        merge-multiple: true

    - name: Copy natives to resources
      run: |
        mkdir -p src/main/resources/natives
        cp -r downloaded-natives/* src/main/resources/natives/

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    - name: Publish to GitHub Packages
      run: ./gradlew publish
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
