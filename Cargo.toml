[package]
name = "connector"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/main/rust/lib.rs"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1

[dependencies]
jni = "0.22.0"
log = "0.4"

# Audio codec dependencies
fdk-aac-sys = { git = "https://github.com/NezuChan/fdk-aac-rs", rev = "40dcfed", optional = true }
mpg123-sys = { version = "0.6.0", optional = true, features = ["static"] }
ogg-sys = { version = "0.0.9", optional = true }
audiopus_sys = { git = "https://github.com/amsam0/audiopus_sys", optional = true }
vorbis-sys = { version = "0.1.1", optional = true }
libsamplerate = { version = "0.1.0", optional = true }

[features]
default = ["opus", "aac", "mp3", "vorbis", "samplerate"]
opus = ["audiopus_sys"]
mp3 = ["mpg123-sys"]
aac = ["fdk-aac-sys"]
vorbis = ["vorbis-sys", "ogg-sys"]
samplerate = ["libsamplerate"]
